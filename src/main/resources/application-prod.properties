# Canlı ortam profili: PostgreSQL, kalıcı.
# docker-compose.yml içindeki postgres servisiyle veya kendi sunucunuzdaki
# bir PostgreSQL instance'ıyla kullanılabilir; DB_* ortam değişkenleriyle yönlendirilir.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dejaview}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:dejaview}
spring.datasource.password=${DB_PASSWORD:dejaview}

spring.h2.console.enabled=false
