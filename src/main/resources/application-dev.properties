# Geliştirme/test profili: H2, bellek içi. Uygulama her yeniden başladığında
# (DataInitializer'ın seed ettiği admin kullanıcısı hariç) veri silinir.
# Testler (@SpringBootTest) de bu profili kullanır — Postgres'e ihtiyaç duymadan çalışırlar.
spring.datasource.url=jdbc:h2:mem:dejaviewdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Konsolu (Tarayıcıdan izleyebilmek için)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
