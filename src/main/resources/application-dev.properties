# =========================================================================
# GELİŞTİRME PROFİLİ (dev)
#
# Bu profil BİLİNÇLİ OLARAK gevşek: SecurityConfig'in dev zinciri tüm uçları
# permitAll yapar, H2 konsolu açıktır ve aşağıdaki sırlar sabittir.
# ASLA üretimde kullanmayın.
#
# Çalıştırmak için:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =========================================================================

# --- Yalnızca yerel geliştirme için sabit sırlar ---
# Bu anahtar public ve herkesin görebileceği bir yerde; sadece dev/test içindir.
# Üretimde JWT_SECRET ortam değişkeni zorunludur (bkz. application.properties).
jwt.secret=dev-ortami-icin-sabit-anahtar-uretimde-asla-kullanilmaz-32byte+

# Yerel geliştirmede otomatik açılan admin hesabı: admin / admin
dejaview.admin.password=admin

# --- H2 konsolu (yalnızca dev) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- SQL logu (yalnızca dev; üretimde gürültü ve veri sızıntısı riski) ---
spring.jpa.show-sql=true
