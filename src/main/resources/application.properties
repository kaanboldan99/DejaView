# Uygulama adı
spring.application.name=DejaView

# Geliştirme profilinde çalışacak ayarlar
spring.profiles.active=dev
server.port=8080

# Canlı ortam ayarları
# spring.profiles.active=prod
# server.port=443
# --- H2 Veritabanı Ayarları ---
spring.datasource.url=jdbc:h2:mem:dejaviewdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Konfigürasyonu
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Konsol Ayarları (Tarayıcıdan izleyebilmek için)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Elasticsearch Ayarları ---
# Varsayılan olarak localhost:9200 (docker-compose ile ayağa kalkan servis).
# Uzak bir sunucu kullanıyorsanız ELASTICSEARCH_HOST ortam değişkenini set edin.
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:9200
spring.elasticsearch.rest.uris=http://${ELASTICSEARCH_HOST:localhost}:9200

# ElasticsearchConfig içindeki username ve password placeholder hatalarını çözmek için eklenen alanlar
spring.elasticsearch.rest.username=
spring.elasticsearch.rest.password=
spring.elasticsearch.username=
spring.elasticsearch.password=

spring.main.allow-bean-definition-overriding=true

# --- RabbitMQ Ayarları ---
# Varsayılan olarak localhost:5672 (docker-compose ile ayağa kalkan servis).
# Uzak bir sunucu kullanıyorsanız RABBITMQ_HOST ortam değişkenini set edin.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Aynı anda birden fazla ticket analizi işlenebilsin diye kuyruk tek thread'le değil,
# 3-10 arası paralel consumer thread'iyle tüketiliyor (yük arttıkça 10'a kadar büyür).
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10

# --- OpenAI API Anahtarı ---
openai.api.key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# --- Gemini API ---
# Model adı zamanla değişiyor (Google eski modelleri kaldırıyor); burada güncel
# tutulmalı. gemini-pro ve gemini-1.5-flash artık kaldırılmış, 404 dönüyor —
# gemini-3.6-flash canlı API'ye karşı test edilerek doğrulandı (2026-08-31).
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
gemini.api.key=${GEMINI_API_KEY:}


# Swagger UI erişim adresi konfigürasyonu
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Loglama (SLF4J + Logback, Spring Boot varsayılanı) ---
logging.level.root=INFO
logging.level.com.skaanb.DejaView=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/dejaview.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
