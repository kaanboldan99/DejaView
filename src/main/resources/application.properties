# Uygulama adı
spring.application.name=DejaView

# --- Profil ---
# Aktif profil BİLİNÇLİ OLARAK burada set edilmiyor. Daha önce "dev" yazılıydı ve
# dev zinciri anyRequest().permitAll() kullandığı için, deploy sırasında profili
# override etmeyi unutmak tüm uçları kimlik doğrulamasız açıyordu — sessizce.
# Profil verilmediğinde Spring "default" profilini aktif eder ve SecurityConfig'in
# @Profile({"prod","default"}) zinciri, yani KORUMALI olan devreye girer.
#
# Yerel geliştirme için profili açıkça verin:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# local-ai profili HER ZAMAN dahil ediliyor: AI analizi yalnızca bu makinedeki
# modelle çalışsın, hiçbir koşulda Gemini'ye/buluta düşmesin diye. Profili
# komut satırında vermeyi unutmak eskiden sessizce Gemini'ye dönüyordu; adres,
# model adı, timeout ve kuyruk eşzamanlılığı artık tek yerden (bkz.
# application-local-ai.properties) ve kendiliğinden geliyor.
# Buluta dönmek isterseniz kaldırmanız gereken tek satır bu.
spring.profiles.include=local-ai

server.port=8080
# --- H2 Veritabanı Ayarları ---
spring.datasource.url=jdbc:h2:mem:dejaviewdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Konfigürasyonu
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# --- Bağlantı Havuzu (HikariCP) ---
# Varsayılan 10 bağlantı; çok sayıda eşzamanlı kullanıcıda (örn. 100+) login/register/profil
# gibi DB'ye giden istekler bu havuzdan geçtiği için büyütüyoruz.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# H2 konsolu ve SQL logu yalnızca dev profilinde açılır
# (bkz. application-dev.properties) — üretimde konsol açık kalmamalı.

# --- Elasticsearch Ayarları ---
# wdmch.server, /etc/hosts üzerinden home-pi'nin Tailscale IP'sine (100.93.71.107) çözülüyor;
# hem evde (LAN) hem dışarıda Tailscale açıkken çalışır. Farklı bir makinede çalıştırıyorsanız
# ELASTICSEARCH_HOST ortam değişkenini set edin.
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:wdmch.server}:9200
spring.elasticsearch.rest.uris=http://${ELASTICSEARCH_HOST:wdmch.server}:9200

# ElasticsearchConfig içindeki username ve password placeholder hatalarını çözmek için eklenen alanlar
spring.elasticsearch.rest.username=
spring.elasticsearch.rest.password=
spring.elasticsearch.username=
spring.elasticsearch.password=

spring.main.allow-bean-definition-overriding=true

# --- RabbitMQ Ayarları ---
# Elasticsearch ile aynı sunucuda (home-pi, Docker) çalıştığı varsayılıyor. wdmch.server,
# /etc/hosts üzerinden home-pi'nin Tailscale IP'sine (100.93.71.107) çözülüyor; hem evde
# (LAN) hem dışarıda Tailscale açıkken çalışır. Farklı bir yerde çalıştırıyorsanız
# RABBITMQ_HOST ortam değişkenini set edin;
# docker run -d --name dejaview-rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:3-management
spring.rabbitmq.host=${RABBITMQ_HOST:wdmch.server}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Aynı anda birden fazla ticket analizi işlenebilsin diye kuyruk tek thread'le değil,
# 3-10 arası paralel consumer thread'iyle tüketiliyor (yük arttıkça 10'a kadar büyür).
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10

# --- Kimlik doğrulama sırları ---
# Boş bırakılırsa uygulama AÇILMAZ (bkz. JwtUtil): sessizce zayıf bir varsayılana
# düşmek, bu ayarın çözmeye çalıştığı sorunun ta kendisi.
# Yeni anahtar üretmek için: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Başlangıç admin hesabının şifresi. Boşsa hesap hiç oluşturulmaz (bkz. DataInitializer).
dejaview.admin.username=${ADMIN_USERNAME:admin}
dejaview.admin.email=${ADMIN_EMAIL:admin@dejaview.com}
dejaview.admin.password=${ADMIN_PASSWORD:}

# --- AI Sağlayıcı Seçimi ---
# Aktif AI sağlayıcısı: "gemini" veya "openai" (bkz. GeminiService / OpenAiService
# @ConditionalOnProperty). Varsayılan openai: OpenAiService aynı zamanda yerel
# modellerin konuştuğu protokolü konuşuyor ve adres yukarıdaki local-ai profilinden
# localhost'a bakıyor, yani varsayılan davranış "bu makinedeki model".
#
# Not: local-ai profili her zaman dahil olduğu için (bkz. spring.profiles.include)
# provider'ı da o dosya sabitliyor; AI_PROVIDER=gemini vermek TEK BAŞINA yeterli
# değil, önce include satırını kaldırmanız gerekir. Bu bilinçli: "yalnızca yerel AI"
# kararının tek bir ortam değişkeniyle delinmesini istemiyoruz.
dejaview.ai.provider=${AI_PROVIDER:openai}

# Bir ticket'a en fazla kaç AI etiketi üretilecek.
dejaview.ai.max-tags=5

# --- OpenAI uyumlu sağlayıcı (yerel model VEYA OpenAI'ın kendisi) ---
# Adres ve model adı konfigürasyondan okunuyor; OpenAiService bu sayede hem
# localhost'taki bir modele hem api.openai.com'a bağlanabiliyor.
#
# Varsayılanlar BİLEREK yerel: application-local-ai.properties henüz git'te
# olmadığı için, o dosya olmayan bir kopyada (taze clone, başka makine) sadece
# spring.profiles.include'a güvenmek adresi buluta düşürürdü. Aynı değerler iki
# yerde duruyor ama "yalnızca yerel AI" kararı tek bir dosyanın varlığına
# bağlı kalmıyor.
openai.api.url=${OPENAI_API_URL:http://localhost:1234/v1/chat/completions}
# "lms ps" çıktısındaki IDENTIFIER ne ise o.
openai.api.model=${OPENAI_API_MODEL:qwen/qwen3-8b}
# RestTemplate varsayılanı sonsuz bekleme; açıkça sınırlıyoruz ki takılan bir sağlayıcı
# RabbitMQ listener thread'lerini süresiz meşgul etmesin. Yerel model bulut API'lerinden
# belirgin şekilde yavaş olduğu için (8B model, istek başına ~30-45 sn) süre bol tutuldu.
openai.api.timeout-seconds=${OPENAI_API_TIMEOUT:180}
# Yerel sunucu anahtar istemiyor; boş bırakıldığında Authorization başlığı hiç
# gönderilmiyor (bkz. OpenAiService.chat). Eskiden burada "sk-xxx..." biçiminde
# sahte bir anahtar duruyordu — gerçek sanılıp aranan, hiçbir işe yaramayan bir
# değerdi. Bulut OpenAI'a bağlanacaksanız OPENAI_API_KEY ortam değişkenini verin.
openai.api.key=${OPENAI_API_KEY:}

# --- Gemini API ---
# KULLANILMIYOR: sağlayıcı yerel modele sabitlendi (bkz. spring.profiles.include).
# Ayarlar, buluta dönmek gerekirse diye duruyor; GeminiService bean'i bu haliyle
# hiç oluşturulmuyor.
# Model adı zamanla değişiyor (Google eski modelleri kaldırıyor); burada güncel
# tutulmalı. gemini-pro ve gemini-1.5-flash artık kaldırılmış, 404 dönüyor —
# gemini-3.6-flash canlı API'ye karşı test edilerek doğrulandı (2026-08-31).
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
gemini.api.key=${GEMINI_API_KEY:}


# Swagger UI erişim adresi konfigürasyonu
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Loglama (SLF4J + Logback, Spring Boot varsayılanı) ---
logging.level.root=INFO
logging.level.com.skaanb.DejaView=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/dejaview.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
