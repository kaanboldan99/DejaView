# =========================================================================
# YEREL AI PROFİLİ (local-ai)
#
# AI çağrılarını buluttan (Gemini/OpenAI) alıp bu makinede çalışan bir modele
# yönlendirir. Amaç: task tagging'i API kotası harcamadan, internet olmadan ve
# kayıtları dışarı göndermeden denemek.
#
# Bu profil ARTIK VARSAYILAN: application.properties içindeki
# spring.profiles.include=local-ai satırı sayesinde hangi profille başlatılırsa
# başlatılsın devreye giriyor. Komut satırında ayrıca vermek gerekmez (vermek de
# zararsız), dev profilinin yerine değil yanında çalışır:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Ön koşul — LM Studio sunucusunun ayakta olması:
#   lms server start
#   lms load qwen/qwen3-8b --context-length 4096 --parallel 1 --gpu max
# =========================================================================

dejaview.ai.provider=openai

# LM Studio'nun OpenAI uyumlu ucu. Ollama kullanıyorsanız tek değişecek yer burası:
#   http://localhost:11434/v1/chat/completions
openai.api.url=http://localhost:1234/v1/chat/completions

# "lms ps" çıktısındaki IDENTIFIER ne ise o.
openai.api.model=qwen/qwen3-8b

# Yerel sunucu anahtar istemiyor; boş bırakıldığında Authorization başlığı hiç
# gönderilmiyor (bkz. OpenAiService.chat).
openai.api.key=

# Bulut API'leri için 60s bolken yerel model için değil. 16 GB'lık bir M3'te
# Qwen3 8B (4-bit) ölçülen değer istek başına ~30-45 saniye; ilk istek modelin
# belleğe yüklenmesiyle daha da uzun sürebiliyor. Timeout'u buna göre açıyoruz —
# analiz zaten RabbitMQ üzerinden arka planda çalıştığı için kullanıcı beklemiyor.
openai.api.timeout-seconds=180

# Yerel modeli tek tek istekle beslemek daha sağlıklı: 16 GB'da eşzamanlı istekler
# KV cache'i büyütüp makineyi swap'e sokuyor ve her istek birden yavaşlıyor.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

# İstek/yanıt gövdesini görmek için:
# logging.level.com.skaanb.DejaView.service.OpenAiService=DEBUG
