services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: dejaview-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - dejaview-es-data:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dejaview-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Yönetim paneli: http://localhost:15672 (guest/guest)

  # Sadece prod profilinde kullanılıyor (bkz. application-prod.properties).
  # dev profili/testler H2 (bellek içi) kullandığı için buna ihtiyaç duymaz.
  postgres:
    image: postgres:16
    container_name: dejaview-postgres
    environment:
      - POSTGRES_DB=dejaview
      - POSTGRES_USER=dejaview
      - POSTGRES_PASSWORD=dejaview
    ports:
      - "5432:5432"
    volumes:
      - dejaview-postgres-data:/var/lib/postgresql/data

volumes:
  dejaview-es-data:
  dejaview-postgres-data:
